<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm of Shadows · Grid map editor</title>
<style>body{margin:20px;background:#172b26;color:#efe6c8;font:16px system-ui}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button,input{font:inherit;padding:8px}main{overflow:auto;height:75vh;margin-top:20px}canvas{image-rendering:pixelated;touch-action:none;border:1px solid #6a8565}p{max-width:900px}</style>
<header><strong>Grid map editor</strong><select id="region"></select><select id="material"></select><label><input type="checkbox" id="roofs" checked> Roofs</label><label><input type="checkbox" id="collision"> Collision preview (doors open)</label><button id="undo">Undo</button><button id="reset">Reset island</button><button id="export">Export grids</button><label>Import <input id="import" type="file" accept="application/json"></label></header>
<p>Paint terrain cells. Water and walls block walking; bridge cells allow it. Buildings and trees remain separate sprites with their own footprints. Save the exported file as <code>packages/game-data/src/grid-overrides.json</code>, then run the map tests and rebuild both services.</p><output id="status"></output><main><canvas></canvas></main>
<script type="module">
import {townDoorVisual,buildingVisuals,villageDoors,isBuildingFloor,gridMap,regions,islandForRegion} from '../../packages/game-data/src/index';
import {paintConnectedTerrain,usesConnectedTerrain} from './src/connected-terrain';
import {paintRegion} from './src/tiled-terrain';
import saved from '../../packages/game-data/src/grid-overrides.json';
const terrain=import.meta.glob('../../assets/world/terrain/*/atlas.png',{eager:true,query:'?url',import:'default'}),props=import.meta.glob('../../assets/world/objects/*.png',{eager:true,query:'?url',import:'default'}),square=import.meta.glob('../../assets/world/square-props/*.png',{eager:true,query:'?url',import:'default'}),images=new Map();
async function load(url){if(!images.has(url)){const image=new Image();image.src=url;await image.decode();images.set(url,image);}return images.get(url);}
const select=document.querySelector('#region'),material=document.querySelector('#material'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),status=document.querySelector('#status');let layout=structuredClone(saved),history=[],drawing=false;
for(const [id,r]of Object.entries(regions))select.add(new Option(r.name,id));['Ground','Path','Stone','Water','Bridge','Wall'].forEach((name,i)=>material.add(new Option(name,i)));
for(const id of ['roofs','collision'])document.querySelector('#'+id).addEventListener('change',()=>draw());
function cells(){return layout.maps[select.value]?.cells??gridMap(select.value).cells;}
async function draw(){const region=select.value,map=gridMap(region),atlasUrl=Object.entries(terrain).find(([p])=>p.includes('/'+islandForRegion(region)+'/'))[1],atlas=await load(atlasUrl),data=cells();canvas.width=map.width*32;canvas.height=map.height*32;ctx.imageSmoothingEnabled=false;if(region==='elderwood-upper')paintRegion(ctx,region,atlas,data);else if(usesConnectedTerrain(region))paintConnectedTerrain(ctx,data,atlas);else for(let y=0;y<map.height;y++)for(let x=0;x<map.width;x++)ctx.drawImage(atlas,data[y][x]*36+2,2,32,32,x*32,y*32,32,32);for(const object of [...buildingVisuals(region,map.objects,document.querySelector('#roofs').checked),...villageDoors(region).map(door=>townDoorVisual(door,true))].sort((a,b)=>(isBuildingFloor(a.key)?-10000:a.footY)-(isBuildingFloor(b.key)?-10000:b.footY))){const url=Object.entries({...square,...props}).find(([p])=>p.endsWith('/'+object.key+'.png'))?.[1];if(url)ctx.drawImage(await load(url),object.x*2/3,object.y*2/3,object.w*2/3,object.h*2/3);}if(document.querySelector('#collision').checked){ctx.fillStyle='#eb575777';for(let y=0;y<map.height;y++)for(let x=0;x<map.width;x++)if(data[y][x]===3||data[y][x]===5||map.propBlocked.has(`${x},${y}`))ctx.fillRect(x*32,y*32,32,32);ctx.strokeStyle='#ffd166';ctx.lineWidth=3;for(const edge of map.edges){const [axis,point]=edge.split(':'),[x,y]=point.split(',').map(Number);ctx.beginPath();ctx.moveTo(x*32,y*32);ctx.lineTo((x+(axis==='h'?1:0))*32,(y+(axis==='v'?1:0))*32);ctx.stroke();}}ctx.strokeStyle='#ffffff22';ctx.lineWidth=1;for(let x=0;x<=map.width;x++){ctx.beginPath();ctx.moveTo(x*32,0);ctx.lineTo(x*32,canvas.height);ctx.stroke();}for(let y=0;y<=map.height;y++){ctx.beginPath();ctx.moveTo(0,y*32);ctx.lineTo(canvas.width,y*32);ctx.stroke();}status.textContent=`${map.width} × ${map.height} cells · each terrain image is 32 × 32 pixels${document.querySelector('#collision').checked?' · Collision preview: red cells block walking; gold lines are walls':''}`;}
function paint(e){const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*canvas.width/r.width/32),y=Math.floor((e.clientY-r.top)*canvas.height/r.height/32),map=gridMap(select.value);if(x<1||y<1||x>=map.width-1||y>=map.height-1)return;layout.maps[select.value]??={cells:structuredClone(map.cells)};layout.maps[select.value].cells[y][x]=Number(material.value);draw();}
canvas.onpointerdown=e=>{history.push(JSON.stringify(layout));drawing=true;canvas.setPointerCapture(e.pointerId);paint(e);};canvas.onpointermove=e=>{if(drawing)paint(e);};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false;select.onchange=draw;document.querySelector('#undo').onclick=()=>{if(history.length)layout=JSON.parse(history.pop());draw();};document.querySelector('#reset').onclick=()=>{history.push(JSON.stringify(layout));delete layout.maps[select.value];draw();};document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(layout,null,2)+'\n'],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='grid-overrides.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.querySelector('#import').onchange=async e=>{try{const parsed=JSON.parse(await e.target.files[0].text());if(parsed.version!==2||!parsed.maps)throw Error('Expected a version-2 grid file');for(const [region,map]of Object.entries(parsed.maps)){if(!Object.hasOwn(regions,region))throw Error('Unknown map');const base=gridMap(region);if(map.cells?.length!==base.height||map.cells.some(row=>row.length!==base.width||row.some(n=>!Number.isInteger(n)||n<0||n>5)))throw Error('Invalid cells');}history.push(JSON.stringify(layout));layout=parsed;draw();}catch(error){status.textContent=error.message;}};draw();
</script></html>
